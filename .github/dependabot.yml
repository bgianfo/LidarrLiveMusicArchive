# Keeps the workflow actions and NuGet packages (MinVer, test libraries) current. The plugin's host
# references are Lidarr's own assemblies, pinned in Directory.Build.props rather than on NuGet.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: nuget
    directories:
      - /src/Lidarr.Plugin.LiveMusicArchive
      - /tests/Lidarr.Plugin.LiveMusicArchive.Tests
    schedule:
      interval: monthly
    ignore:
      # Pinned to the major version Lidarr's assemblies are built against (see the test csproj); bump it together
      # with LidarrVersion when Lidarr moves to a newer .NET.
      - dependency-name: System.Diagnostics.EventLog
        update-types: ["version-update:semver-major"]
      # 18.x's coverage collector needs the .NET 10 SDK; CI builds with SDK 8 (see the test csproj).
      - dependency-name: Microsoft.NET.Test.Sdk
        update-types: ["version-update:semver-major"]
